name: Validate knowledge library

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 检查正文基本信息是否同步
        run: python scripts/sync_paper_info.py --check
      - name: 校验论文元数据
        run: python scripts/validate_library.py
      - name: 检查自动索引是否最新
        run: python scripts/build_index.py --check
